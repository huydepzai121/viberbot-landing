server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Stable aliases (e.g. /downloads/windows) written by scripts/sync-downloads.sh.
    include /data/downloads/nginx-aliases.conf;

    location = /downloads/latest.json {
        alias /data/downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /downloads/nginx-aliases.conf {
        default_type text/plain;
        return 404;
    }

    location /downloads/ {
        alias /data/downloads/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        gzip off;
        charset off;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
