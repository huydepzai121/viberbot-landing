server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;


    # Download counters: /dl/<id> increments then 302s to the real file (GitHub
    # or /downloads alias). /api/download-stats is the public JSON. Counting
    # only happens on /dl/, so the follow-up 302 is not double-counted.
    location = /api/download-stats {
        proxy_pass http://stats:8080/stats;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location ^~ /dl/ {
        proxy_pass http://stats:8080;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache" always;
    }

    # Stable aliases (e.g. /downloads/windows) written by scripts/sync-downloads.sh.
    include /data/downloads/nginx-aliases.conf;

    location = /downloads/latest.json {
        alias /data/downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /downloads/nginx-aliases.conf {
        default_type text/plain;
        return 404;
    }

    location /downloads/ {
        alias /data/downloads/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        gzip off;
        charset off;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Mintlify static export (mint export --base-path /docs), bind-mounted at /data/docs.
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/_mintlify/assets/ {
        root /data;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /docs/_mintlify/export-assets/ {
        root /data;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /docs/ {
        root /data;
        index index.html;
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
